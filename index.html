<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Super Mario Land 2</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    /* Pantalla inicial idéntica a la imagen */
    #start-overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      background: radial-gradient(circle, #2a1b3d 0%, #0a0a0a 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 20px;
      text-align: center;
    }

    #start-overlay h1 {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
      letter-spacing: 1px;
      color: #9b4dca;
    }

    #start-overlay p {
      font-size: 14px;
      color: #aaaaaa;
      margin-bottom: 30px;
    }

    #btn-start {
      padding: 18px 40px;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1px;
      background-color: #7b2cbf;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(123, 44, 191, 0.45);
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    #btn-start:active {
      transform: scale(0.95);
      background-color: #5a189a;
    }

    /* Contenedor del emulador sin cambios */
    #game-container {
      width: 100vw;
      height: 100dvh;
      max-width: 600px;
      position: relative;
    }

    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- Pantalla de inicio -->
  <div id="start-overlay">
    <h1>GAME BOY COLOR</h1>
    <p>Presiona el botón para iniciar la consola</p>
    <button id="btn-start">START GAME</button>
  </div>

  <!-- Contenedor donde se dibuja el emulador (tal como estaba) -->
  <div id="game-container">
    <div id="game"></div>
  </div>

  <!-- Configuración original de EmulatorJS -->
  <script>
    // 1. Dónde se montará el juego
    EJS_player = '#game';

    // 2. Consola que emula:
    EJS_core = 'gb';

    // 3. Nombre EXACTO del archivo ROM que subiste a GitHub
    EJS_gameUrl = 'AdventureIsland.gb';

    // 4. Servidor que carga el motor del emulador
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/ [cdn.emulatorjs.org]';

    // Al pulsar START GAME se oculta la portada y se activa el audio
    document.getElementById('btn-start').addEventListener('click', function () {
      document.getElementById('start-overlay').style.display = 'none';
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          const audioCtx = new AudioContext();
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
        }
      } catch (e) {}
    });
  </script>

  <!-- Script que arranca el emulador (tal como estaba) -->
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js [cdn.emulatorjs.org]"></script>

</body>
</html>
