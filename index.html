<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Adventure Island - Game Boy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      background-color: #000000;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }

    /* Pantalla de inicio clásica de Game Boy */
    #start-overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      background-color: #c4c1b8;
      border: 8px solid #8c8980;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 20px;
      text-align: center;
    }

    .gb-screen-box {
      background-color: #8b956d;
      border: 6px solid #595d6e;
      border-radius: 10px 10px 35px 10px;
      padding: 24px 28px;
      margin-bottom: 30px;
      box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.35);
      max-width: 340px;
      width: 100%;
    }

    .gb-screen-box h1 {
      font-size: 20px;
      color: #1f2611;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
      font-weight: 900;
    }

    .gb-screen-box p {
      font-size: 12px;
      color: #2c3519;
      font-weight: bold;
    }

    /* Botón START GAME centrado con color magenta clásico */
    #btn-start {
      padding: 18px 42px;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      background-color: #8b1d41;
      color: #f4f1ea;
      border: 4px solid #5c1029;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 0 #420b1d, 0 10px 20px rgba(0, 0, 0, 0.35);
    }

    #btn-start:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #420b1d;
      background-color: #701533;
    }

    /* Botones de velocidad en español */
    #speed-controls {
      display: none;
      position: fixed;
      top: env(safe-area-inset-top, 8px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 5000;
      gap: 8px;
      background: rgba(20, 20, 20, 0.85);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid #444;
    }

    .speed-btn {
      background-color: #49475b;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .speed-btn.active {
      background-color: #8b1d41;
    }

    #game-container {
      width: 100vw;
      height: 100dvh;
      max-width: 600px;
      position: relative;
    }

    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- Pantalla inicial centrada -->
  <div id="start-overlay">
    <div class="gb-screen-box">
      <h1>ADVENTURE ISLAND</h1>
      <p>GAME BOY • STEREO SOUND</p>
    </div>
    <button id="btn-start">START GAME</button>
  </div>

  <!-- Controles de velocidad en español -->
  <div id="speed-controls">
    <button class="speed-btn" id="btn-slow">LENTO</button>
    <button class="speed-btn active" id="btn-normal">NORMAL</button>
    <button class="speed-btn" id="btn-fast">RÁPIDO</button>
  </div>

  <!-- Contenedor del emulador -->
  <div id="game-container">
    <div id="game"></div>
  </div>

  <!-- Configuración directa de EmulatorJS -->
  <script>
    EJS_player = '#game';
    EJS_core = 'gb';
    EJS_gameUrl = 'AdventureIsland.gb [adventureisland.gb]';
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/ [cdn.emulatorjs.org]';
    EJS_language = 'es-ES';
    EJS_startOnLoaded = true;
    EJS_Buttons = {
      playPause: true,
      restart: true,
      mute: true,
      settings: false,
      fullscreen: false,
      saveState: true,
      loadState: true,
      screenRecord: false,
      gamepad: true,
      cheat: false,
      volume: true,
      quickSave: false,
      quickLoad: false,
      screenshot: false,
      cacheManager: false
    };
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js [cdn.emulatorjs.org]"></script>

  <script>
    document.addEventListener('gesturestart', function (e) {
      e.preventDefault();
    });

    function setGameSpeed(mode, activeBtnId) {
      document.querySelectorAll('.speed-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(activeBtnId).classList.add('active');

      if (window.EJS_emulator && window.EJS_emulator.gameManager) {
        if (mode === 'fast') {
          window.EJS_emulator.gameManager.toggleFastForward(true);
          window.EJS_emulator.gameManager.toggleSlowMotion(false);
        } else if (mode === 'slow') {
          window.EJS_emulator.gameManager.toggleFastForward(false);
          window.EJS_emulator.gameManager.toggleSlowMotion(true);
        } else {
          window.EJS_emulator.gameManager.toggleFastForward(false);
          window.EJS_emulator.gameManager.toggleSlowMotion(false);
        }
      }
    }

    document.getElementById('btn-slow').addEventListener('click', () => setGameSpeed('slow', 'btn-slow'));
    document.getElementById('btn-normal').addEventListener('click', () => setGameSpeed('normal', 'btn-normal'));
    document.getElementById('btn-fast').addEventListener('click', () => setGameSpeed('fast', 'btn-fast'));

    document.getElementById('btn-start').addEventListener('click', function () {
      document.getElementById('start-overlay').style.display = 'none';
      document.getElementById('speed-controls').style.display = 'flex';

      // Desbloquea el audio en Safari (iOS) y reanuda el emulador si estaba pausado
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          const audioCtx = new AudioContext();
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
        }
        if (window.EJS_emulator && window.EJS_emulator.play [window.ejs_emulator.play]) {
          window.EJS_emulator.play [window.ejs_emulator.play]();
        }
      } catch (e) {}
    });
  </script>

</body>
</html>
